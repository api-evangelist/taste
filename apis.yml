aid: taste
name: Taste
description: >-
  Taste Labs is a San Francisco research lab and infrastructure company building
  "the taste layer for AI" — decoding subjective design domains to end AI slop.
  Its Taste Engine API extracts brand and design guidelines from a reference site
  or a prior submission and enhances website and slide-deck prompts so AI
  generation stays on-brand, returning an enhanced prompt plus structured brand
  context and reasoning. The company is backed by CRV and Amplify Partners and
  runs the TasteMakers community program. This profile was enriched from the
  provider's live public surface, including the Taste Engine API OpenAPI.
